[package]
name = "hardpoint-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line front end for the Hardpoint DCS World mod manager"

[[bin]]
name = "hardpoint"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
hardpoint-core = { path = "../hardpoint-core" }
serde = "1.0.229"
serde_json = "1.0.154"
