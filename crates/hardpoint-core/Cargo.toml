[package]
name = "hardpoint-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
hex = "0.4.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.24.1", features = ["deflate"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = "3.5.0"
walkdir = "2.5.0"
zip = "9.0.5"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
