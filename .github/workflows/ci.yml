name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine tests (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p hardpoint-core -p hardpoint-cli

  index-and-web:
    name: Index, hub site, desktop UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate index (and check links)
        run: node index/scripts/build.mjs --check-urls
      - run: npm run build -w apps/hub
      - run: npm run build -w apps/desktop

  desktop-compile:
    name: Desktop app compiles (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build -w apps/desktop
      - run: cargo build -p hardpoint-desktop
