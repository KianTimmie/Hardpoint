# Push a tag like v0.1.0 to build the Windows installer and CLI and attach them to a draft release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Hardpoint ${{ github.ref_name }}
          releaseDraft: true
      - name: Build CLI
        run: cargo build --release -p hardpoint-cli
      - name: Attach CLI
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release upload ${{ github.ref_name }} target/release/hardpoint.exe --clobber
